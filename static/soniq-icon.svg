<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="soniqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a"/>
      <stop offset="50%" stop-color="#121629"/>
      <stop offset="100%" stop-color="#070912"/>
    </linearGradient>
    <linearGradient id="soniqGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="waveGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo arredondado com borda sutil -->
  <rect width="512" height="512" rx="128" fill="url(#soniqBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#soniqGlow)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Brilho de fundo -->
  <circle cx="256" cy="256" r="140" fill="url(#soniqGlow)" opacity="0.15" filter="url(#glow)"/>

  <!-- Logo Soniq: Barras equalizadoras e fluxo sonoro -->
  <g filter="url(#glow)">
    <rect x="130" y="210" width="28" height="92" rx="14" fill="url(#waveGlow)" opacity="0.85"/>
    <rect x="180" y="150" width="28" height="212" rx="14" fill="url(#waveGlow)"/>
    <rect x="230" y="110" width="28" height="292" rx="14" fill="url(#waveGlow)"/>
    <rect x="280" y="160" width="28" height="192" rx="14" fill="url(#waveGlow)"/>
    <rect x="330" y="220" width="28" height="72" rx="14" fill="url(#waveGlow)" opacity="0.85"/>

    <path d="M 144 210 C 144 140, 240 120, 256 120 C 330 120, 370 170, 370 230 C 370 290, 310 320, 256 340 C 200 360, 150 380, 150 420 C 150 460, 210 470, 256 470" 
          fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
    <circle cx="256" cy="470" r="10" fill="#06b6d4"/>
    <circle cx="144" cy="210" r="10" fill="#ec4899"/>
  </g>
</svg>
