<!doctype html>
<html lang="pt-BR" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/soniq-icon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0c16" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="description" content="Soniq — Seu player de música pessoal com busca no YouTube, playlists locais e sem anúncios próprios." />
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Google Fonts: Plus Jakarta Sans & Outfit -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

		<!-- YouTube IFrame API pre-connect -->
		<link rel="preconnect" href="https://www.youtube.com" />
		<link rel="preconnect" href="https://www.google.com" />

		<title>Soniq — Player de Música Pessoal</title>
		%sveltekit.head%
	</head>
	<body class="bg-surface-base text-foreground antialiased selection:bg-indigo-500 selection:text-white" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				const isLocalNetwork =
					window.location.hostname === 'localhost' ||
					window.location.hostname === '127.0.0.1' ||
					window.location.hostname.startsWith('192.168.') ||
					window.location.hostname.startsWith('10.') ||
					window.location.hostname.startsWith('172.') ||
					window.location.port === '5173';

				if (isLocalNetwork) {
					// Em rede local / desenvolvimento, desregistra service workers para servir atualizações instantâneas
					navigator.serviceWorker.getRegistrations().then(registrations => {
						for (const reg of registrations) {
							reg.unregister();
						}
					});
					if ('caches' in window) {
						caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
					}
				} else {
					window.addEventListener('load', () => {
						navigator.serviceWorker.register('/service-worker.js').catch(() => {});
					});
				}
			}
		</script>
	</body>
</html>
